name: Check math department registrations

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check department website
        run: node --use-system-ca scripts/check-updates.mjs
        env:
          ONESIGNAL_APP_ID: a3217828-5fbb-4f4f-a902-cccc4bbb3f88
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
      - name: Save new updates
        run: |
          git config user.name "studyflow-bot"
          git config user.email "studyflow-bot@users.noreply.github.com"
          git add data/updates.json
          git diff --cached --quiet || git commit -m "Update registration notices"
          git push
